name: Build-Release[Windows-WPF]

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # 手动触发：用运行号做修订号，保证单调递增且可追溯
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          echo " resolved: $(cat "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish windows/OASX.WPF.csproj
          -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }}

      - name: Package zip
        shell: pwsh
        run: |
          $dir = "windows/bin/Release/net8.0-windows/win-x64/publish"
          Get-ChildItem $dir -Filter *.log -ErrorAction SilentlyContinue | Remove-Item -Force
          Compress-Archive -Path "$dir/*" `
            -DestinationPath "OASX-Win-${{ steps.version.outputs.version }}.zip" -Force
          Get-Item "OASX-Win-${{ steps.version.outputs.version }}.zip" |
            Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: OASX-Win-${{ steps.version.outputs.version }}
          path: OASX-Win-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Create release and upload (tag builds only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "OASX-Win-${{ steps.version.outputs.version }}.zip#OASX-Win-${{ steps.version.outputs.version }}.zip" \
            --title "OASX $GITHUB_REF_NAME" \
            --generate-notes

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OASX-Android-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error